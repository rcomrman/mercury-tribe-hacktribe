name: Mercury BLECHTRIBE smoke test

on:
  push:
    branches:
      - mercury-blechtribe
  pull_request:
    paths:
      - 'blechtribe/**'
      - '.github/workflows/mercury-blechtribe.yml'

permissions:
  contents: read

jobs:
  gelumpe-simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mercury Dust
        uses: actions/checkout@v4
      - name: Checkout official GELUMPE sources
        uses: actions/checkout@v4
        with:
          repository: KuhlerBuhler/kuhlers-gelumpe
          path: kuhlers-gelumpe
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and simulate Mercury V30
        run: node blechtribe/tests/check-mercury.mjs ./kuhlers-gelumpe
      - name: Render eight Mercury scenes in simulator
        run: node blechtribe/tests/render-preview.mjs ./kuhlers-gelumpe
      - name: Save simulator visual previews
        uses: actions/upload-artifact@v4
        with:
          name: mercury-blechtribe-preview
          path: blechtribe/out/mercury-scenes.svg
          if-no-files-found: error
      - name: Compile and simulate Mercury R3 bitmap
        run: node blechtribe/tests/check-r3.mjs ./kuhlers-gelumpe
      - name: Render Mercury R3 bitmap contact sheet
        run: node blechtribe/tests/render-r3.mjs ./kuhlers-gelumpe
      - name: Save Mercury R3 preview
        uses: actions/upload-artifact@v4
        with:
          name: mercury-r3-bitmap-preview
          path: blechtribe/out/mercury-r3-scenes.svg
          if-no-files-found: error
      - name: Capture Mercury R3 movement
        run: node blechtribe/tests/render-motion-r3.mjs ./kuhlers-gelumpe
      - name: Upload authentic simulator animation frames
        uses: actions/upload-artifact@v4
        with:
          name: mercury-r3-motion-frames
          path: blechtribe/out/r3-motion/*.pgm
          if-no-files-found: error

      - name: Compile and stress Mercury R4 braid
        run: node blechtribe/tests/check-r4.mjs ./kuhlers-gelumpe
      - name: Render R4 eight presets
        run: node blechtribe/tests/render-r4.mjs ./kuhlers-gelumpe
      - name: Render R4 organic groove motion
        run: node blechtribe/tests/render-motion-r4.mjs ./kuhlers-gelumpe
      - name: Upload R4 preview
        uses: actions/upload-artifact@v4
        with:
          name: mercury-r4-braid-preview
          path: |
            blechtribe/out/mercury-r4-scenes.svg
            blechtribe/out/r4-motion/*.pgm
          if-no-files-found: error

      - name: Compile and stress Mercury R5 folded coils
        run: node blechtribe/tests/check-r5.mjs ./kuhlers-gelumpe
      - name: Render Mercury R5 coil snapshots
        run: node blechtribe/tests/render-r5.mjs ./kuhlers-gelumpe
      - name: Render Mercury R5 coil motion
        run: node blechtribe/tests/render-motion-r5.mjs ./kuhlers-gelumpe
      - name: Upload R5 artwork comparison
        uses: actions/upload-artifact@v4
        with:
          name: mercury-r5-v30-coils
          path: |
            blechtribe/out/mercury-r5-scenes.svg
            blechtribe/out/r5-motion/*.pgm
          if-no-files-found: error
